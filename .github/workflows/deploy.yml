name: Build & Deploy

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-2               # ← Andy: change if your account uses a different region
  ECR_REPOSITORY: ctpm-dashboard      # ← Andy: ECR repo name (create it once in AWS console)
  APP_RUNNER_SERVICE_ARN: ""          # ← Andy: paste the App Runner service ARN here after first deploy

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Trigger App Runner deployment
        if: env.APP_RUNNER_SERVICE_ARN != ''
        run: |
          aws apprunner start-deployment \
            --service-arn "${{ env.APP_RUNNER_SERVICE_ARN }}"
